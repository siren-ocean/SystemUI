    implementation files('../libs/com.android.window.flags.window-aconfig-java.jar')
    implementation files('../libs/com_android_wm_shell_flags_lib.jar')
    implementation files('../libs/perfetto_trace_java_protos.jar')

    implementation project(':iconloaderlib')
