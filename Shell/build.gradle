plugins {
    id 'com.android.library'
}

apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    compileSdk COMPILE_SDK.toInteger()

    defaultConfig {
        minSdk MIN_SDK_VERSION.toInteger()
        targetSdk TARGET_SDK_VERSION.toInteger()
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        buildConfig = false
    }

    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += [
                '-Xjvm-default=all'
        ]
    }

    sourceSets {
        main {
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            res.srcDirs = ['res']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}

dependencies {
    compileOnly files('../libs/framework.jar')
    implementation files('../libs/protolog-lib.jar')
    implementation files('../libs/libprotobuf-java-nano.jar')
    implementation files('../libs/WindowManager-Shell-proto.jar')

    implementation project(':iconloaderlib')
    implementation(':dynamicanimation-1.1.0-alpha04@aar')

    implementation libs.appcompat
    implementation libs.core.runtime
    implementation libs.recyclerview
    implementation libs.constraintlayout
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.core
    implementation libs.core.ktx
    implementation libs.javax.inject

    implementation libs.dagger.android
    kapt libs.dagger.compiler
}