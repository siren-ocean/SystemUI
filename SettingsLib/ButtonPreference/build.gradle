plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace "com.android.settingslib.widget.preference.button"

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        buildConfig = false
    }

    sourceSets {
        main {
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}

dependencies {
    implementation(':preference-1.3.0-alpha01@aar')
    implementation project(':SettingsLib:SettingsTheme')
    implementation libs.appcompat
    implementation libs.recyclerview
}